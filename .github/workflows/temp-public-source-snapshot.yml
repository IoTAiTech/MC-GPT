# Temporary audit/materialization workflow. It removes itself in the verified child commit.
name: Materialize reviewed PR23 correction
on:
  push:
    branches: [fix/verified-runtime-boundaries-20260904]
    paths: [.github/workflows/temp-public-source-snapshot.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_COMMIT: c9149ebd4ca6a0f533a2d76fd0407d278ba2e43f
      EXPECTED_TREE: 3a7143ff8bd1b59ea8187ebceaff4c9aedc32aef
      PATCH_SHA256: 1cb26ce2f61dbbf1363b051bec5aaea6f82d10c600665a354da2cfa7364b1092
      PATCH_GZ_SHA256: 8fd8fbf3343907528d484d6a132aebdc029556bb83901a10583e3a6b82c35d0c
    steps:
      - name: Checkout current branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 20
          persist-credentials: true
      - name: Reconstruct, verify, apply, test and commit
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          cat > /tmp/correction.patch.gz.b64 <<'B64'

B64
          base64 -d /tmp/correction.patch.gz.b64 > /tmp/correction.patch.gz
          test "$(sha256sum /tmp/correction.patch.gz | awk '{print $1}')" = "$PATCH_GZ_SHA256"
          gzip -dc /tmp/correction.patch.gz > /tmp/correction.patch
          test "$(sha256sum /tmp/correction.patch | awk '{print $1}')" = "$PATCH_SHA256"
          git apply --check /tmp/correction.patch
          git apply --index /tmp/correction.patch
          git rm -- .github/workflows/temp-public-source-snapshot.yml
          expected_files=$(cat <<'FILES'
.github/workflows/runtime-boundary-qualification.yml
CHANGELOG.md
docs/runtime-integration-reconciliation.md
src/iot_ai/agentic.py
src/iot_ai/provider_catalog.py
src/iot_ai/runtime_gates.py
src/iot_ai/test_execution_evidence.py
src/iot_ai/tool_router.py
src/iot_ai/workspace.py
tests/test_codex_review_regressions.py
tests/test_effort_settings_parity.py
FILES
)
          test "$(git diff --cached --name-only "$BASE_COMMIT")" = "$expected_files"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          python tools/no_arabic_script_check.py .
          python tools/public_boundary_check.py .
          python tools/check_license_headers.py .
          python tools/static_security_audit.py .
          git diff --cached --check
          PYTHONPATH=src python -m pytest -q \
            tests/test_codex_review_regressions.py \
            tests/test_effort_settings_parity.py \
            tests/test_runtime_boundary_evidence.py \
            tests/test_host_test_execution.py \
            tests/test_installed_workflow_trace.py \
            tests/test_completion_authority_regressions.py
          git config user.name 'Dr.-Ing. Babak Sorkhpour'
          git config user.email 'info@iot-ai.tech'
          git commit -m 'fix(runtime): close Codex exact-head evidence and concurrency findings' \
            -m 'Close fallback effort normalization, live readiness support intersection, completion-time evidence revalidation, bounded subprocess output, and graph-scoped node persistence. Seven unchanged review regressions fail on c9149eb and pass on this candidate. No provider calls, release, PMD operation, or production claim.'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin HEAD:fix/verified-runtime-boundaries-20260904
