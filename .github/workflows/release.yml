name: Developer Preview release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Resolve and verify annotated tag
        env:
          RAW_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${RAW_TAG}"
          elif [[ "${EVENT_NAME}" == "release" ]]; then
            TAG="${RELEASE_TAG}"
          else
            TAG="${REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "invalid release tag" >&2
            exit 1
          fi
          git fetch --tags --force origin
          git rev-parse --verify "refs/tags/${TAG}^{tag}"
          COMMIT="$(git rev-list -n 1 "refs/tags/${TAG}")"
          git checkout --detach "${COMMIT}"
          test "$(git rev-parse HEAD)" = "${COMMIT}"
          printf 'TAG=%s\n' "${TAG}" >> "${GITHUB_ENV}"
          printf 'RELEASE_COMMIT=%s\n' "${COMMIT}" >> "${GITHUB_ENV}"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[dev]"
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          python tools/public_boundary_check.py . --git-history
          python tools/eu_ai_act_release_gate.py .
          python tools/verify_repository.py . --check-sbom
          OUT_DIR="${RUNNER_TEMP}/iot-ai-release"
          mkdir -p "$OUT_DIR"
          set +e
          python -m pytest -vv --tb=short --junitxml="$OUT_DIR/junit-release.xml" tests 2>&1 | tee "$OUT_DIR/pytest-output.txt"
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Release verify pytest"
            echo "Exit: $status"
            echo '```text'
            tail -n 120 "$OUT_DIR/pytest-output.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Build Python artifacts
        run: python -m build --sdist --wheel
      - name: Build deterministic repository archive
        run: python tools/build_release.py . dist
      - name: Create checksums
        shell: bash
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.TAG }}
          path: |
            dist/
            ${{ runner.temp }}/iot-ai-release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Developer Preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="IOT-AI Suite 6.7.0-beta.6 / MC-GPT 0.8.0-alpha.6 — Natural-Language Autonomous Multi-Agent Coding Developer Preview"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<'MD'
          Developer preview of MC-GPT / IOT-AI Suite with natural-language-first Task → Meeting → Multi-Coder closed-loop orchestration.

          Supported provider families: Claude, Codex, Gemini, Grok, and exact Ollama local/cloud seats when configured.
          The loop validates tasks, holds planning/failure meetings, performs bounded repairs, runs deterministic tests, audits evidence, and stops only at a truthful terminal state.
          Not a production claim. Not a legal certification.
          MD
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists; leaving assets immutable"
            exit 0
          fi
          gh release create "$TAG" dist/* --verify-tag --prerelease --title "$TITLE" --notes-file "$NOTES"

  packages:
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      IMAGE: ghcr.io/iotaitech/mc-gpt
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true
      - name: Resolve and verify annotated tag
        env:
          RAW_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${RAW_TAG}"
          elif [[ "${EVENT_NAME}" == "release" ]]; then
            TAG="${RELEASE_TAG}"
          else
            TAG="${REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "invalid release tag" >&2
            exit 1
          fi
          git fetch --tags --force origin
          git rev-parse --verify "refs/tags/${TAG}^{tag}"
          COMMIT="$(git rev-list -n 1 "refs/tags/${TAG}")"
          git checkout --detach "${COMMIT}"
          test "$(git rev-parse HEAD)" = "${COMMIT}"
          if [[ ! -f Dockerfile ]]; then
            git show "${WORKFLOW_SHA}:Dockerfile" > Dockerfile
            git show "${WORKFLOW_SHA}:.dockerignore" > .dockerignore
          fi
          test -f Dockerfile
          printf 'TAG=%s\n' "${TAG}" >> "${GITHUB_ENV}"
          printf 'RELEASE_COMMIT=%s\n' "${COMMIT}" >> "${GITHUB_ENV}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/iotaitech/mc-gpt
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/IoTAiTech/MC-GPT
            org.opencontainers.image.url=https://github.com/IoTAiTech/MC-GPT
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.title=MC-GPT / IOT-AI Coder Suite
      - name: Build and push GHCR image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          scope: "@iotaitech"
      - name: Publish GitHub Packages npm
        if: hashFiles('npm/package.json') != ''
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cp -f ../LICENSE LICENSE
          cp -f ../NOTICE NOTICE
          node --input-type=commonjs <<'JS'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.name = "@iotaitech/mc-gpt";
          pkg.repository = {
            type: "git",
            url: "git+https://github.com/IoTAiTech/MC-GPT.git"
          };
          pkg.publishConfig = {
            registry: "https://npm.pkg.github.com",
            access: "public"
          };
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          JS
          if npm publish --access public; then
            echo "published @iotaitech/mc-gpt"
          else
            npm view "@iotaitech/mc-gpt@$(node -p 'require(\"./package.json\").version')" --registry https://npm.pkg.github.com
          fi
      - name: Report package linkage and public-visibility gap
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          still_private=0
          for spec in container/mc-gpt npm/mc-gpt; do
            echo "::group::${spec}"
            body="$(gh api "/orgs/${OWNER}/packages/${spec}" || true)"
            vis=""
            if printf '%s' "$body" | jq -e . >/dev/null 2>&1; then
              printf '%s\n' "$body" | jq -r '"name \(.name // "")\ntype \(.package_type // "")\nvisibility \(.visibility // "")\nhtml_url \(.html_url // "")\nrepository \(.repository.full_name // "")"'
              vis="$(printf '%s\n' "$body" | jq -r '.visibility // empty')"
            else
              echo "package metadata unavailable"
            fi
            if [[ "${vis}" != "public" ]]; then
              still_private=1
            fi
            echo "::endgroup::"
          done
          if [[ "${still_private}" -eq 1 ]]; then
            echo "::warning::GitHub Packages stay private until an org owner flips Package settings → Danger Zone → Change visibility → Public (one-way). REST and GraphQL cannot change GHCR/npm visibility. After that one-time flip, every later tag stays on the Packages tab."
            echo "https://github.com/orgs/${OWNER}/packages/container/package/mc-gpt"
            echo "https://github.com/orgs/${OWNER}/packages/npm/package/mc-gpt"
          fi
