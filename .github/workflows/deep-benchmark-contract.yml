name: Deep benchmark contract

on:
  pull_request:
    paths:
      - "benchmarks/deep-mncg-openwiki/**"
      - "docs/research/openwiki-assessment.md"
      - ".github/workflows/deep-benchmark-contract.yml"
  push:
    branches:
      - "benchmark/mncg-openwiki-v1"
    paths:
      - "benchmarks/deep-mncg-openwiki/**"
      - "docs/research/openwiki-assessment.md"
      - ".github/workflows/deep-benchmark-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate benchmark contract
        run: python3 benchmarks/deep-mncg-openwiki/scripts/validate_benchmark.py benchmarks/deep-mncg-openwiki
      - name: Run benchmark contract tests
        run: python3 -m unittest discover -s benchmarks/deep-mncg-openwiki/tests -p "test_*.py"
      - name: Confirm no provider execution is configured
        run: |
          test ! -f benchmarks/deep-mncg-openwiki/MODELS.local.json
          grep -q 'provider_trials_executed: `0`' benchmarks/deep-mncg-openwiki/README.md
