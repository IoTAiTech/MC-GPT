name: Deep benchmark contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "benchmarks/deep-mncg-openwiki/**"
      - "docs/research/openwiki-assessment.md"
      - ".github/workflows/deep-benchmark-contract.yml"
  push:
    branches:
      - main
    paths:
      - "benchmarks/deep-mncg-openwiki/**"
      - "docs/research/openwiki-assessment.md"
      - ".github/workflows/deep-benchmark-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate benchmark contract
        run: python3 benchmarks/deep-mncg-openwiki/scripts/validate_benchmark.py benchmarks/deep-mncg-openwiki
      - name: Run benchmark contract tests
        run: python3 -m unittest discover -s benchmarks/deep-mncg-openwiki/tests -p "test_*.py"
      - name: Confirm no provider execution or performance claim is configured
        run: |
          test ! -f benchmarks/deep-mncg-openwiki/MODELS.local.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path("benchmarks/deep-mncg-openwiki/STATUS.json").read_text(
                  encoding="utf-8"
              )
          )
          assert status["provider_trials_executed"] == 0
          assert status["performance_claim_allowed"] is False
          assert status["production_claim"] is False
          assert status["benchmark_id"] == "mcgpt-mncg-openwiki-2026-02"
          treatments = json.loads(
              Path("benchmarks/deep-mncg-openwiki/TREATMENTS.json").read_text(
                  encoding="utf-8"
              )
          )["treatments"]
          d_mncg = treatments["D_MNCG"]
          e_openwiki = treatments["E_OPENWIKI"]
          assert d_mncg["runtime_component"] is True
          assert d_mncg["production_eligibility"] is True
          assert d_mncg["authoritative"] is True
          assert e_openwiki["runtime_component"] is False
          assert e_openwiki["default_enabled"] is False
          assert e_openwiki["production_eligibility"] == "conditional"
          assert e_openwiki["task_authority"] is False
          assert e_openwiki["direct_product_db_access"] is False
          assert e_openwiki["direct_golden_write"] is False
          PY
