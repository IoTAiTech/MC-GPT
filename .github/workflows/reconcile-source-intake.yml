name: Read-only reconciliation source
on:
  push:
    branches: [fix/verified-runtime-boundaries-20260905]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2e0e73ecc1fd178aae23e8955ebbcfdf2ede88f0
          persist-credentials: false
      - name: Archive exact public tree without running project code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2e0e73ecc1fd178aae23e8955ebbcfdf2ede88f0
          mkdir -p "$RUNNER_TEMP/reconcile-source"
          git archive --format=zip HEAD > "$RUNNER_TEMP/reconcile-source/source.zip"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/reconcile-source/identity.txt"
          cd "$RUNNER_TEMP/reconcile-source"
          sha256sum source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: concurrent-public-source
          path: ${{ runner.temp }}/reconcile-source/
          retention-days: 3
