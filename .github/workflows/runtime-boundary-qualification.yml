name: Runtime boundary qualification

on:
  push:
    branches: [fix/verified-runtime-boundaries-20260904]
  pull_request:
    paths:
      - src/iot_ai/**
      - tests/**
      - .github/workflows/runtime-boundary-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      DO_NOT_TRACK: '1'
      OPENWIKI_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify public source boundaries
        run: |
          python tools/public_boundary_check.py .
          python tools/no_arabic_script_check.py .
          python tools/check_license_headers.py .
      - name: Run deterministic boundary regressions
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/runtime-boundary
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python -m pytest -q tests/test_runtime_boundary_evidence.py tests/test_visual_adapter_failures.py tests/test_runtime_enforcement_corrective.py tests/test_installed_workflow_trace.py tests/test_effort_settings_parity.py tests/test_host_test_execution.py tests/test_completion_authority_regressions.py --junitxml="$EVIDENCE_DIR/junit.xml"
      - name: Seal minimal qualification evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/runtime-boundary
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PYCODE'
          import hashlib
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path(os.environ['EVIDENCE_DIR'])
          out.mkdir(parents=True, exist_ok=True)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          head, tree = git('rev-parse', 'HEAD'), git('rev-parse', 'HEAD^{tree}')
          if head != os.environ['EXPECTED_HEAD']:
              raise SystemExit('candidate-head-mismatch')
          junit = out / 'junit.xml'
          if not junit.is_file():
              raise SystemExit('test-evidence-missing')
          cases = ET.parse(junit).getroot().findall('.//testcase')
          totals = {
              'tests': len(cases),
              'failures': sum(case.find('failure') is not None for case in cases),
              'errors': sum(case.find('error') is not None for case in cases),
              'skipped': sum(case.find('skipped') is not None for case in cases),
          }
          receipt = {
              'schema': 'iot-ai.runtime-boundary-qualification.v1',
              'head': head,
              'tree': tree,
              'junit_sha256': hashlib.sha256(junit.read_bytes()).hexdigest(),
              'totals': totals,
              'decision': 'pass' if totals['tests'] and not totals['failures'] and not totals['errors'] else 'block',
              'scope': 'synthetic-boundary-and-runtime-trace-not-production',
              'source_archive_uploaded': False,
              'raw_diagnostics_uploaded': False,
              'provider_calls': 0,
              'production_claim': False,
          }
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, sort_keys=True))
          if receipt['decision'] != 'pass':
              raise SystemExit('boundary-tests-failed')
          PYCODE
      - name: Upload minimal qualification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-boundary-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/runtime-boundary/receipt.json
          retention-days: 14
          if-no-files-found: error
