name: Minimum change benchmark and OpenWiki qualification

on:
  push:
    branches:
      - main
    paths:
      - "benchmarks/minimum-change-v2/**"
      - "benchmarks/deep-mncg-openwiki/**"
      - "docs/research/openwiki-assessment.md"
      - ".github/workflows/benchmark-minimum-change-openwiki.yml"
  pull_request:
    branches:
      - main
    paths:
      - "benchmarks/minimum-change-v2/**"
      - "benchmarks/deep-mncg-openwiki/**"
      - "docs/research/openwiki-assessment.md"
      - ".github/workflows/benchmark-minimum-change-openwiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimum-change-openwiki-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWIKI_COMMIT: 58a1358e1f7d5b883db7405f56dcbdac3c4d7fe5
  PNPM_VERSION: 10.33.2

jobs:
  benchmark-protocol:
    name: Benchmark protocol Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out MC-GPT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile and test protocol
        run: |
          set -euo pipefail
          python -m compileall -q benchmarks/minimum-change-v2 tests/test_minimum_change_benchmark_v2.py
          python -m pytest -q tests/test_minimum_change_benchmark_v2.py

      - name: Validate and run synthetic self-test
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/minimum-change-v2"
          mkdir -p "$OUT"
          python benchmarks/minimum-change-v2/benchmark.py validate > "$OUT/validation.json"
          python benchmarks/minimum-change-v2/benchmark.py schedule \
            --providers openai-codex \
            --output "$OUT/schedule.json"
          python benchmarks/minimum-change-v2/benchmark.py selftest \
            --output-dir "$OUT/selftest" > "$OUT/selftest-output.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          analysis = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "minimum-change-v2" / "selftest" / "analysis.json").read_text()
          )
          assert analysis["decision"] == "pass"
          assert analysis["any_savings_claim_allowed"] is False
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: minimum-change-benchmark-${{ matrix.python }}
          path: ${{ runner.temp }}/minimum-change-v2/**
          if-no-files-found: error
          retention-days: 14

  openwiki-upstream:
    name: OpenWiki upstream qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      OPENWIKI_TELEMETRY_DISABLED: "1"
      OPENWIKI_DEV: "1"
      OPENWIKI_CONFIG_DIR: /tmp/openwiki-config
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Check out MC-GPT contract source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: mcgpt
          persist-credentials: false

      - name: Confirm the benchmark and workflow use the same OpenWiki pin
        shell: bash
        run: |
          set -euo pipefail
          PIN="$(python -c 'import json; print(json.load(open("mcgpt/benchmarks/deep-mncg-openwiki/RUN_MATRIX.json"))["source_freeze"]["openwiki"])')"
          test "$PIN" = "$OPENWIKI_COMMIT"

      - name: Check out OpenWiki at reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: langchain-ai/openwiki
          ref: ${{ env.OPENWIKI_COMMIT }}
          path: openwiki-upstream
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: openwiki-upstream/pnpm-lock.yaml

      - name: Verify exact source
        working-directory: openwiki-upstream
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OPENWIKI_COMMIT"
          test "$(node -p "require('./package.json').license")" = "MIT"
          test "$(node -p "require('./package.json').version")" = "0.4.3"
          test -z "$(git status --porcelain)"
          test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Install frozen dependencies
        working-directory: openwiki-upstream
        run: pnpm install --frozen-lockfile

      - name: Run upstream quality pipeline
        working-directory: openwiki-upstream
        run: |
          set -euo pipefail
          pnpm run format:check
          pnpm run lint:check
          pnpm test
          pnpm run eval:ledger:typecheck

      - name: Provider-free CLI smoke
        working-directory: openwiki-upstream
        run: |
          set -euo pipefail
          node dist/cli/cli.js --help > "${RUNNER_TEMP}/openwiki-help.txt"
          mkdir -p "${RUNNER_TEMP}/openwiki-smoke-repo"
          cd "${RUNNER_TEMP}/openwiki-smoke-repo"
          git init -q
          printf '# Fixture\n' > README.md
          git add README.md
          git -c user.name='MC-GPT Audit' -c user.email='audit@example.invalid' commit -q -m fixture
          node "${GITHUB_WORKSPACE}/openwiki-upstream/dist/cli/cli.js" \
            code --dry-run --init > "${RUNNER_TEMP}/openwiki-dry-run.txt"

      - name: Build qualification receipt
        working-directory: openwiki-upstream
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"),crypto=require("crypto"),pkg=require("./package.json"); const r={schema:"iot-ai.openwiki-upstream-qualification.v2",repository:"langchain-ai/openwiki",commit:process.env.OPENWIKI_COMMIT,package_version:pkg.version,node:process.version,pnpm:process.env.PNPM_VERSION,telemetry_disabled:process.env.DO_NOT_TRACK==="1"&&process.env.OPENWIKI_TELEMETRY_DISABLED==="1",frozen_install:true,format:"pass",lint:"pass",upstream_test_pipeline:"pass",eval_ledger_typecheck:"pass",cli_help:"pass",provider_free_dry_run:"pass",provider_calls:0,production_claim:false}; r.receipt_sha256=crypto.createHash("sha256").update(JSON.stringify(r)).digest("hex"); fs.writeFileSync(process.env.RUNNER_TEMP+"/openwiki-qualification.json",JSON.stringify(r,null,2)+"\n")'

      - name: Upload OpenWiki qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openwiki-upstream-qualification
          path: |
            ${{ runner.temp }}/openwiki-qualification.json
            ${{ runner.temp }}/openwiki-help.txt
            ${{ runner.temp }}/openwiki-dry-run.txt
          if-no-files-found: error
          retention-days: 14
