name: Public source audit evidence
on:
  push:
    branches: [audit/integration-evidence-20260904]
    paths: [.github/workflows/public-audit-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-audit-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'IoTAiTech/MC-GPT'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0ce651b32ad5e197db0ee51dc3e48e5db5659ca4
          fetch-depth: 1
          persist-credentials: false
      - name: Capture tracked public source only
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=0ce651b32ad5e197db0ee51dc3e48e5db5659ca4
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          if git ls-tree -r --name-only HEAD | grep -E '^(enterprise|private|evidence-private|secrets|customer)/'; then
            echo 'Forbidden public-export root detected'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/public-audit"
          git archive --format=zip --output="$RUNNER_TEMP/public-audit/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/public-audit/SOURCE_COMMIT.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/public-audit/SOURCE_TREE.txt"
          (cd "$RUNNER_TEMP/public-audit" && sha256sum source.zip > SHA256SUMS.txt)
          printf '%s\n' 'Public tracked source snapshot. No repository code executed. No provider calls. Not a release or qualification claim.' > "$RUNNER_TEMP/public-audit/SCOPE.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcgpt-public-audit-source
          path: ${{ runner.temp }}/public-audit/
          if-no-files-found: error
          retention-days: 3
