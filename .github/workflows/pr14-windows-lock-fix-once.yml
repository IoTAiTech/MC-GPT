# Author: Dr.-Ing. Babak Sorkhpour, with AI assistance
# Version: 1.0.0
# One-use workflow: patches the Windows lock contention defect, tests it,
# commits the durable source/test changes, and removes itself.
name: PR14 Windows lock fix once

on:
  push:
    branches:
      - feature/minimum-necessary-change-gate-v1
    paths:
      - .github/workflows/pr14-windows-lock-fix-once.yml

permissions:
  contents: write

jobs:
  patch-test-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply bounded patch and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          util = Path("src/iot_ai/util.py")
          source = util.read_text(encoding="utf-8")
          old = '''@contextmanager
          def exclusive_lock(lock_path: Path,*,timeout_seconds: float=5.0,stale_seconds: float=120.0):
              lock_path.parent.mkdir(parents=True,exist_ok=True);deadline=time.monotonic()+timeout_seconds;fd=None
              while fd is None:
                  try: fd=os.open(lock_path,os.O_CREAT|os.O_EXCL|os.O_WRONLY,0o600)
                  except FileExistsError:
                      try:
                          if time.time()-lock_path.stat().st_mtime>stale_seconds: lock_path.unlink(missing_ok=True);continue
                      except FileNotFoundError: continue
                      if time.monotonic()>=deadline: raise TimeoutError(f"timed out acquiring lock: {lock_path}")
                      time.sleep(0.02)
              try:
                  os.write(fd,json.dumps({"pid":os.getpid(),"created_at":utc_now()},sort_keys=True).encode());os.fsync(fd);yield
              finally:
                  if fd is not None: os.close(fd)
                  lock_path.unlink(missing_ok=True)
          '''
          new = '''def _lock_file_exists(lock_path: Path) -> bool:
              """Return whether a lock path exists without masking a real access failure."""
              try:
                  return os.path.lexists(lock_path)
              except OSError:
                  return False


          def _recover_stale_lock(lock_path: Path, *, stale_seconds: float) -> bool:
              """Remove one stale lock when its metadata is readable and it is not held."""
              try:
                  stale = time.time() - lock_path.stat().st_mtime > stale_seconds
              except FileNotFoundError:
                  return True
              except PermissionError:
                  # Windows may deny metadata access while another process holds the file.
                  return False
              if not stale:
                  return False
              try:
                  lock_path.unlink()
              except FileNotFoundError:
                  return True
              except PermissionError:
                  # A still-open Windows lock is active even when its timestamp is old.
                  return False
              return True


          @contextmanager
          def exclusive_lock(
              lock_path: Path,
              *,
              timeout_seconds: float = 5.0,
              stale_seconds: float = 120.0,
          ):
              """Acquire a cross-platform exclusive lock file and remove it on exit.

              Windows can report an existing, open lock file as ``PermissionError``
              rather than ``FileExistsError``. Treat that specific case as contention,
              while preserving fail-closed behaviour for genuine directory permissions.
              """
              lock_path.parent.mkdir(parents=True, exist_ok=True)
              deadline = time.monotonic() + timeout_seconds
              fd: int | None = None
              while fd is None:
                  try:
                      fd = os.open(lock_path, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
                  except FileExistsError:
                      if _recover_stale_lock(lock_path, stale_seconds=stale_seconds):
                          continue
                  except PermissionError:
                      if not _lock_file_exists(lock_path):
                          raise
                      if _recover_stale_lock(lock_path, stale_seconds=stale_seconds):
                          continue
                  if fd is None:
                      if time.monotonic() >= deadline:
                          raise TimeoutError(f"timed out acquiring lock: {lock_path}")
                      time.sleep(0.02)
              try:
                  payload = json.dumps(
                      {"pid": os.getpid(), "created_at": utc_now()}, sort_keys=True
                  ).encode()
                  os.write(fd, payload)
                  os.fsync(fd)
                  yield
              finally:
                  if fd is not None:
                      os.close(fd)
                  lock_path.unlink(missing_ok=True)
          '''
          if old not in source:
              raise SystemExit("exclusive_lock source block did not match the reviewed head")
          util.write_text(source.replace(old, new), encoding="utf-8")

          test = Path("tests/test_exclusive_lock.py")
          test.write_text('''# SPDX-License-Identifier: LicenseRef-PolyForm-Noncommercial-1.0.0
          # Required Notice: Copyright 2026 IoT-AI.Tech / Dr.-Ing. Babak Sorkhpour
          # Author: Dr.-Ing. Babak Sorkhpour, with AI assistance
          # Version: 6.8.0-beta.1 | Date: 2026-08-30
          """Cross-platform contention contracts for the exclusive lock helper."""
          from __future__ import annotations

          import errno
          import os
          import tempfile
          import time
          import unittest
          from pathlib import Path
          from unittest.mock import patch

          from iot_ai.util import exclusive_lock


          class ExclusiveLockTests(unittest.TestCase):
              def test_existing_lock_permission_error_is_treated_as_contention(self) -> None:
                  with tempfile.TemporaryDirectory() as temporary:
                      lock = Path(temporary) / "state.lock"
                      lock.write_text("stale", encoding="utf-8")
                      stale_time = time.time() - 10
                      os.utime(lock, (stale_time, stale_time))
                      original_open = os.open
                      injected = False

                      def open_once_as_windows_contention(
                          path: os.PathLike[str] | str,
                          flags: int,
                          mode: int = 0o777,
                          *args: object,
                          **kwargs: object,
                      ) -> int:
                          nonlocal injected
                          if Path(path) == lock and not injected:
                              injected = True
                              raise PermissionError(
                                  errno.EACCES, "simulated sharing violation", str(path)
                              )
                          return original_open(path, flags, mode, *args, **kwargs)

                      with patch(
                          "iot_ai.util.os.open", side_effect=open_once_as_windows_contention
                      ):
                          with exclusive_lock(
                              lock, timeout_seconds=1.0, stale_seconds=0.1
                          ):
                              self.assertTrue(lock.exists())

                      self.assertTrue(injected)
                      self.assertFalse(lock.exists())

              def test_permission_error_without_existing_lock_is_not_masked(self) -> None:
                  with tempfile.TemporaryDirectory() as temporary:
                      lock = Path(temporary) / "state.lock"
                      denied = PermissionError(
                          errno.EACCES, "simulated access denial", str(lock)
                      )
                      with patch("iot_ai.util.os.open", side_effect=denied):
                          with self.assertRaises(PermissionError):
                              with exclusive_lock(lock, timeout_seconds=0.05):
                                  self.fail("lock must not be acquired")


          if __name__ == "__main__":
              unittest.main()
          ''', encoding="utf-8")
          PY

      - name: Install and run focused regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -e ".[dev]"
          python3 -m pytest -q \
            tests/test_exclusive_lock.py \
            tests/test_eu_ai_act.py::EuAiActTests::test_concurrent_disclosure_receipts_preserve_hash_chain
          python3 -m compileall -q src tests
          git diff --check

      - name: Commit durable fix and remove one-use workflow
        shell: bash
        env:
          TARGET_BRANCH: feature/minimum-necessary-change-gate-v1
        run: |
          set -euo pipefail
          git rm .github/workflows/pr14-windows-lock-fix-once.yml
          git add src/iot_ai/util.py tests/test_exclusive_lock.py
          git config user.name "Dr. Babak Sorkhpour"
          git config user.email "babakskr@gmail.com"
          git commit -m "fix(windows): treat open lock sharing violations as contention" \
            -m "Preserve fail-closed behaviour for real access denial and add deterministic cross-platform regression tests." \
            -m "Author: Dr.-Ing. Babak Sorkhpour, with AI assistance" \
            -m "production_claim: false"
          git push origin "HEAD:${TARGET_BRANCH}"
