# One-use, exact-tree finalization on the isolated corrective branch only.
name: Verify exact runtime correction
on:
  push:
    branches: [fix/verified-runtime-boundaries-20260905]
permissions:
  contents: read
concurrency:
  group: runtime-boundary-finalization
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Materialize only the reviewed exact source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/verified-runtime-boundaries-20260905
          echo '494fec4968785503e4e5275280295ec91325335bf4a690c568a953b74477836a  .github/runtime-boundary-existing.patch' | sha256sum -c -
          git apply --check --index .github/runtime-boundary-existing.patch
          git apply --index .github/runtime-boundary-existing.patch
          git rm .github/runtime-boundary-existing.patch .github/workflows/runtime-boundary-finalize.yml
          test "$(git write-tree)" = 558b54baa1e4337763c7e68d2ff8b0afb1b7a042
      - name: Install declared development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test reviewed source and installed distribution
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q
      - name: Validate publication boundaries without exemptions
        run: |
          python tools/public_boundary_check.py .
          python tools/no_arabic_script_check.py .
          python tools/check_license_headers.py .
          python tools/verify_repository.py .
  publish-isolated-candidate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Commit the same verified tree without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/verified-runtime-boundaries-20260905
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          echo '494fec4968785503e4e5275280295ec91325335bf4a690c568a953b74477836a  .github/runtime-boundary-existing.patch' | sha256sum -c -
          git apply --check --index .github/runtime-boundary-existing.patch
          git apply --index .github/runtime-boundary-existing.patch
          git rm .github/runtime-boundary-existing.patch .github/workflows/runtime-boundary-finalize.yml
          test "$(git write-tree)" = 558b54baa1e4337763c7e68d2ff8b0afb1b7a042
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(runtime): enforce current authority and runner-owned visual evidence'
          test "$(git rev-parse HEAD^{tree})" = 558b54baa1e4337763c7e68d2ff8b0afb1b7a042
          git push origin "HEAD:refs/heads/$branch"
