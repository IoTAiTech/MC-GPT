name: Distribution and installed skills
on:
  push:
    branches: [audit/integration-evidence-20260904]
  pull_request:
    paths:
      - 'setup.py'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - 'tools/package_assets.py'
      - 'tools/build_wheel.py'
      - 'skills/**'
      - 'governance/garden-skills.lock.json'
      - 'src/iot_ai/skill_registry.py'
      - 'tests/test_distribution_asset_parity.py'
      - '.github/workflows/distribution-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distribution-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared development dependencies
        run: python -m pip install -e .[dev]
      - name: Validate distribution assets outside the checkout
        run: python -m pytest -q tests/test_distribution_asset_parity.py
      - name: Validate complete Linux regression suite
        if: runner.os == 'Linux'
        env:
          REPORT_DIR: ${{ runner.temp }}
        run: python -m pytest -q --junitxml="$REPORT_DIR/distribution-regression.xml"
      - name: Validate public source boundaries
        if: runner.os == 'Linux'
        run: |
          python tools/public_boundary_check.py .
          python tools/no_arabic_script_check.py .
          python tools/check_license_headers.py .
