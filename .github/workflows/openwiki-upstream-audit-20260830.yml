# Author: Dr.-Ing. Babak Sorkhpour, with AI assistance
# Version: 1.0.0 | Date: 2026-08-30
# Temporary, read-only upstream qualification workflow.
name: OpenWiki pinned upstream audit

on:
  push:
    branches:
      - audit/openwiki-05aa586-20260830
    paths:
      - .github/workflows/openwiki-upstream-audit-20260830.yml

permissions:
  contents: read

env:
  OPENWIKI_COMMIT: 05aa586bd945afc1d5c1a1e8af15a4f3d1fae3fe
  PNPM_VERSION: 10.33.2

jobs:
  source-quality:
    name: OpenWiki source quality / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Checkout pinned OpenWiki source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: langchain-ai/openwiki
          ref: ${{ env.OPENWIKI_COMMIT }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OPENWIKI_COMMIT"
          test "$(node -p "require('./package.json').license")" = "MIT"
          test "$(node -p "require('./package.json').version")" = "0.4.3"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install exact lockfile
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Format, lint, typecheck, build, coverage and CLI smoke
        shell: bash
        env:
          OPENWIKI_DEV: "1"
          OPENWIKI_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        run: |
          set -euo pipefail
          pnpm run format:check
          pnpm run lint:check
          pnpm run typecheck
          pnpm run build
          pnpm run coverage
          node dist/cli/cli.js code --dry-run --init

      - name: Record source-quality receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          node --version > audit-output/node-version.txt
          pnpm --version > audit-output/pnpm-version.txt
          git rev-parse HEAD > audit-output/openwiki-commit.txt
          sha256sum package.json pnpm-lock.yaml > audit-output/source-input-sha256.txt

      - name: Upload source-quality receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: openwiki-${{ env.OPENWIKI_COMMIT }}-node-${{ matrix.node }}
          path: audit-output
          if-no-files-found: error
          retention-days: 3

  windows-portability:
    name: OpenWiki Windows portability / Node 22
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pinned OpenWiki source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: langchain-ai/openwiki
          ref: ${{ env.OPENWIKI_COMMIT }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:OPENWIKI_COMMIT) { throw "source identity mismatch" }

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install exact lockfile
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run upstream Windows portability tests
        shell: pwsh
        env:
          OPENWIKI_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        run: pnpm exec vitest run test/agent/skills.test.ts test/config/env-behavior.test.ts

  dependency-audit:
    name: OpenWiki dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned OpenWiki source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: langchain-ai/openwiki
          ref: ${{ env.OPENWIKI_COMMIT }}
          persist-credentials: false
          fetch-depth: 1

      - name: Audit lockfile for fixed and unfixed high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
