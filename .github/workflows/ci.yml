name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    # Windows remains EXTERNAL_PENDING for real on-device qualification (FINAL_STATUS).
    # Keep the matrix for signal, but do not block Community RC publication on it.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Pytest
        run: python -m pytest -q
      - name: Public boundary
        run: python tools/public_boundary_check.py .
      - name: EU AI Act technical release gate
        run: python tools/eu_ai_act_release_gate.py .
      - name: Repository contract
        run: python tools/verify_repository.py .
